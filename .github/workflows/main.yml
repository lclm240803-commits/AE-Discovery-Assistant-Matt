name: Keep Supabase Alive

on:
  schedule:
    # Runs EVERY DAY at 03:15 UTC (11:15 AM SGT)
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -s -X GET "https://omcpabdkgeevdrvoomww.supabase.co/rest/v1/AE_Mock_Dataset?select=*&limit=1" \
               -H "apikey: ${{ secrets.SUPABASE_KEY }}"
